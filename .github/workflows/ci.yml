name: CI — Helmet quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # قيم وهمية فقط حتى يكتمل البناء بلا أسرار حقيقية.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: validation-only-key
      VITE_SUPABASE_STORAGE_BUCKET: uploads
      VITE_PUBLIC_SITE_URL: https://example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Parse Electron main process
        run: node --check electron/main.cjs

      - name: Parse Electron preload
        run: node --check electron/preload.cjs

      - name: Verify vercel.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
