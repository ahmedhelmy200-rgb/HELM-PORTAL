    <script>
      (function () {
        try {
          var preference = localStorage.getItem('helm_theme_preference') || 'system';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = preference === 'dark' || (preference === 'system' && systemDark);
          var root = document.documentElement;
          root.classList.add(dark ? 'theme-dark' : 'theme-light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', dark ? '#06142c' : '#f7f9fd');
        } catch (_) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
